<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maristas Hoy</title>
<link rel="icon" href="fotos/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=UnifrakturMaguntia&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<script src="notas.js"></script>
</head>
<body>
<div id="progreso"></div>
<div id="petalos"></div>

<header>
  <div class="wrap barra">
    <a href="index.html" class="marca"><div class="logo" data-logo>MCH</div><span>Maristas Hoy</span></a>
    <div class="acciones">
      <a class="ico volver" href="index.html">← Portada</a>
      <button class="ico" id="btnPetalos" title="Pétalos" aria-label="Pétalos"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="6" r="3"/><circle cx="12" cy="18" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="12" r="3"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg></button>
      <button class="ico" id="btnTema" title="Cambiar tema" aria-label="Cambiar tema"></button>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer>
  <div class="wrap">
    <div class="marca"><div class="logo" data-logo>MCH</div> Maristas Hoy</div>
    © 2026 · Colegio Marcelino Champagnat · Hecho por el Grupo 3°B
  </div>
</footer>

<div id="visor"><img alt=""></div>
<div id="toast">Enlace copiado</div>
<button id="arriba" title="Volver arriba">↑</button>

<script>
const SV=(p,f)=>`<svg viewBox="0 0 24 24" width="17" height="17" fill="${f?'currentColor':'none'}" stroke="${f?'none':'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const SOL=SV('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>');
const LUNA=SV('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>');
const REAC=[['Me gusta',SV('<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>',1)],
 ['Me prende',SV('<path d="M13.5.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5.67z"/>',1)],
 ['Me divierte',SV('<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/>')]];
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const guardar=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const leer=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const id=new URLSearchParams(location.search).get('id')||location.hash.slice(1);
const n=NOTAS[id];
const app=$('#app');

const foto=(src,ph,clase='',pie='')=>!src?`<figure class="foto ${clase} sinfoto"><span class="marca-agua">${esc(ph)}</span></figure>`:`<figure class="foto ${clase}" data-src="${src}" data-ph="${esc(ph)}">${pie?`<figcaption style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);color:#fff;font-size:.85rem;padding:8px 12px;z-index:2">${esc(pie)}</figcaption>`:''}</figure>`;

function bloque(b){
  if(typeof b==='string') return `<p>${esc(b)}</p>`;
  if(b.h) return `<h2>${esc(b.h)}</h2>`;
  if(b.cita) return `<blockquote>“${esc(b.cita)}”${b.de?`<div style="font:600 .85rem Inter;color:var(--oro);margin-top:8px">— ${esc(b.de)}</div>`:''}</blockquote>`;
  if(b.lista) return `<ul>${b.lista.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;
  if(b.foto) return foto(b.foto,'Imagen','',b.pie);
  return '';
}

if(!n){
  app.innerHTML=`<div style="text-align:center;padding:100px 0"><div style="font:900 6rem 'Playfair Display',serif;color:var(--llama);line-height:1">404</div><h1 style="font:900 2.4rem 'Playfair Display';color:var(--titulo)">Esta nota se fue al Mictlán</h1><p class="p">No encontramos la página que buscas.</p><div class="btns" style="justify-content:center"><a class="btn oro" href="index.html">← Volver a la portada</a></div></div>`;
}else{
  document.title=`${n.titulo} · Maristas Hoy`;
  const palabras=n.cuerpo.map(b=>typeof b==='string'?b:(b.h||b.cita||(b.lista||[]).join(' ')||'')).join(' ').split(/\s+/).length;
  const min=Math.max(1,Math.round(palabras/200));
  const pos=ORDEN.indexOf(id), ant=NOTAS[ORDEN[(pos-1+ORDEN.length)%ORDEN.length]], sig=NOTAS[ORDEN[(pos+1)%ORDEN.length]];
  const idAnt=ORDEN[(pos-1+ORDEN.length)%ORDEN.length], idSig=ORDEN[(pos+1)%ORDEN.length];
  const otras=ORDEN.filter(k=>k!==id).sort(()=>Math.random()-.5).slice(0,3);

  app.innerHTML=`
  <section class="art-hero">
    ${foto(n.foto,n.seccion,n.color)}
    <div class="contenido">
      <span class="etiqueta">${esc(n.seccion)}</span>
      <h1>${esc(n.titulo)}</h1>
      <p>${esc(n.subtitulo)}</p>
      <div class="meta"><span class="chip">${esc(n.autor)}</span><span class="chip">${esc(n.fecha)}</span><span class="chip">${min} min de lectura</span></div>
    </div>
  </section>

  <article class="articulo">
    ${n.cuerpo.map(bloque).join('')}
    <div class="barra-art">
      <div class="reac" style="margin:0" data-id="${id}"></div>
      <div class="btns" style="margin:0">
        <button class="btn vidrio" id="compartir" style="color:var(--txt);border-color:var(--borde)"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg> Compartir</button>
        <a class="btn oro" href="index.html">← Portada</a>
      </div>
    </div>
    <div class="navnotas">
      <a class="card" href="nota.html?id=${idAnt}"><small>← Anterior</small><h3>${esc(ant.titulo)}</h3></a>
      <a class="card der" href="nota.html?id=${idSig}"><small>Siguiente →</small><h3>${esc(sig.titulo)}</h3></a>
    </div>
  </article>

  <div class="sec">Sigue leyendo</div>
  <div class="mas">${otras.map(k=>`<a class="card" href="nota.html?id=${k}">${foto(NOTAS[k].foto,NOTAS[k].seccion,NOTAS[k].color)}<span class="etiqueta" style="margin-top:12px">${esc(NOTAS[k].seccion)}</span><h3>${esc(NOTAS[k].titulo)}</h3></a>`).join('')}</div>`;
}

// Fotos: si no existe el archivo queda la etiqueta
$$('[data-src]').forEach(el=>{
  const cap=el.querySelector('figcaption');
  if(el.dataset.ph){el.insertAdjacentHTML('afterbegin','<span class="ph">'+esc(el.dataset.ph)+'</span>')}
  const img=new Image();img.alt="";
  img.onload=()=>{el.querySelector('.ph')?.remove();el.insertBefore(img,cap);el.addEventListener('click',e=>{if(!el.closest('a')){abrir(img.src)}})};
  img.src=el.dataset.src;
});
$$('[data-logo]').forEach(el=>{const i=new Image();i.onload=()=>{el.textContent='';el.appendChild(i)};i.src='fotos/logo.png'});

// Visor
const visor=$('#visor');
function abrir(src){visor.querySelector('img').src=src;visor.classList.add('on')}
visor.onclick=()=>visor.classList.remove('on');

// Tema (se comparte con la portada)
const tema=leer('mh-tema','dark');
document.documentElement.dataset.theme=tema;$('#btnTema').innerHTML=tema==='dark'?SOL:LUNA;
$('#btnTema').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=t;$('#btnTema').innerHTML=t==='dark'?SOL:LUNA;guardar('mh-tema',t)};

// Pétalos
let petalosOn=true;const cont=$('#petalos');
setInterval(()=>{if(!petalosOn||document.hidden)return;const p=document.createElement('div');p.className='petalo';
  p.style.left=Math.random()*100+'vw';p.style.animationDuration=6+Math.random()*6+'s';
  p.style.background=['#f7c21a','#e8841c','#8a1c1c','#6d2a72'][Math.floor(Math.random()*4)];
  cont.appendChild(p);setTimeout(()=>p.remove(),12000)},900);
$('#btnPetalos').onclick=()=>{petalosOn=!petalosOn;$('#btnPetalos').style.opacity=petalosOn?1:.4};

// Reacciones (mismas que en la portada)
$$('.reac').forEach(r=>{const k=r.dataset.id;const datos=leer('mh-r-'+k,{});
  REAC.forEach(([e,ic],i)=>{const b=document.createElement('button');const base=[12,8,5][i];b.title=e;b.setAttribute('aria-label',e);
    const pint=()=>{b.innerHTML=`${ic} ${base+(datos[e]?1:0)}`;b.classList.toggle('on',!!datos[e])};
    b.onclick=()=>{datos[e]=!datos[e];guardar('mh-r-'+k,datos);pint();b.animate([{transform:'scale(1.4)'},{transform:'scale(1)'}],300)};
    pint();r.appendChild(b)})});

// Compartir
const btnC=$('#compartir');
if(btnC) btnC.onclick=async()=>{
  if(navigator.share){try{await navigator.share({title:document.title,url:location.href})}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href)}catch(e){}$('#toast').classList.add('on');setTimeout(()=>$('#toast').classList.remove('on'),2000)}};

// Transición al cambiar de página
$$('a[href]').forEach(a=>{if(a.target||a.href.startsWith('#'))return;
  a.addEventListener('click',e=>{e.preventDefault();document.body.classList.add('saliendo');setTimeout(()=>location.href=a.href,250)})});
window.addEventListener('pageshow',()=>document.body.classList.remove('saliendo'));

// Scroll
window.addEventListener('scroll',()=>{const h=document.documentElement;
  $('#progreso').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';
  $('#arriba').classList.toggle('on',h.scrollTop>600)});
$('#arriba').onclick=()=>scrollTo({top:0});
</script>
</body>
</html>
